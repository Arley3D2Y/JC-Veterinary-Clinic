<h1 class="text-center">{{ operation | titlecase }} Veterinario</h1>

<form #vetForm="ngForm" (ngSubmit)="saveVet(vetForm)" class="container mt-4">

  <!-- Campo Nombre -->
  <div class="form-floating mb-3">
    <input [(ngModel)]="formVeterinario.nombre" name="nombre" required type="text" class="form-control" id="nombre"
      placeholder="Ingresa tu nombre">
    <label for="nombre">Nombre</label>
  </div>

  <!-- Campo Cédula -->
  <div class="form-floating mb-3">
    <input [(ngModel)]="formVeterinario.cedula" name="cedula" required type="text" class="form-control" id="cedula"
      placeholder="Ingresa tu cédula">
    <label for="cedula">Cédula</label>
  </div>

  <!-- Campo Correo -->
  <div class="form-floating mb-3">
    <input [(ngModel)]="formVeterinario.correo" name="correo" required type="email" class="form-control" id="correo"
      placeholder="Ingresa tu correo">
    <label for="correo">Email</label>
  </div>

  <!-- Campo Foto (URL) -->
  <div class="form-floating mb-3">
    <input [(ngModel)]="formVeterinario.fotoString" name="fotoString" type="text" class="form-control" id="fotoString"
      placeholder="Ingresa URL de la foto">
    <label for="fotoString">Foto URL</label>
  </div>

  <!-- Selección de Especialidad -->
  <div class="form-group mb-3">
    <label for="especialidadSelect" class="form-label">Especialidad</label>
    <select [(ngModel)]="selectedEspecialidad" name="especialidad" required class="form-select" id="especialidadSelect"
      (change)="selectedEspecialidad && onSelectSpeciality(selectedEspecialidad)">
      <option *ngFor="let especialidad of especialidades" [ngValue]="especialidad">{{ especialidad.nombre }}</option>
    </select>
  </div>

  <!-- Botones de Acción -->
  <div class="d-flex justify-content-center gap-3 mt-4">
    <button type="button" (click)="pageBack()" class="btn btn-danger">Volver</button>
    <button type="submit" [disabled]="!vetForm.form.valid" class="btn btn-primary">{{ operation | titlecase }}</button>
  </div>
</form>
