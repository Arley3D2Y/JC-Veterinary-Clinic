<h1 id="h1OperationMascota">{{ operation | titlecase }} mascota de {{ customer.nombre }}</h1>

<!-- Formulario -->
<form #petForm="ngForm" (ngSubmit)="savePet(petForm)">
    <div class="row  g-3">
        <div class="col form-floating mb-3">
            <input [(ngModel)]="formPet.nombre" type="text" class="form-control" id="nombre" placeholder="Nombre"
                name="nombre" required>
            <label for="nombre">Nombre</label>
        </div>

        <div class="col form-floating mb-3">
            <input [(ngModel)]="formPet.fotoString" type="text" class="form-control" id="foto"
                placeholder="Ingresa URL de la foto" name="fotoString" required>
            <label for="Foto">Foto</label>
        </div>
    </div>

    <div class="row  g-3">
        <div class="col form-floating mb-3">
            <input [(ngModel)]="formPet.peso" type="text" class="form-control" id="peso" placeholder="Peso" name="peso">
            <label for="peso" required>Peso</label>
        </div>
        <div class="col form-floating mb-3">
            <input [(ngModel)]="formPet.edad" type="text" class="form-control" id="edad" placeholder="Edad" name="edad">
            <label for="edad" required>Edad</label>
        </div>
        <div class="col form-floating mb-3">
            <input [(ngModel)]="formPet.raza" type="text" class="form-control" id="raza" placeholder="Raza" name="raza">
            <label for="raza" required>Raza</label>
        </div>
    </div>

    <div class="row  g-3">
        <div class="col form-floating mb-3">
            <div class="form-floating">
                <select [(ngModel)]="formPet.estado" class="form-control" id="estado" name="estado">
                    <option value="" disabled selected>Seleccione un estado</option>
                    <!-- Genera las opciones desde el enum -->
                    <option *ngFor="let estado of estados | keyvalue" [ngValue]="estado.value">
                        {{ estado.key }}
                    </option>
                </select>
                <label for="estado">Estado</label>
            </div>
        </div>

        <div class="col form-floating mb-3">
            <select class="form-select form-control" [(ngModel)]="formPet.sexo" id="sexo" name="sexo">
                <option value="" disabled selected>Elegir sexo</option>
                <option value="Macho">Macho</option>
                <option value="Hembra">Hembra</option>
            </select>
            <label for="sexo">Sexo</label>
        </div>
    </div>

    <div class="row  g-3">
        <div class="col form-floating mb-3">
            <div class="form-floating">
                <select [(ngModel)]="formPet.enfermedad" class="form-select" id="floatingEnfermedad" name="enfermedad"
                    aria-label="Floating label select example" required>
                    <option selected>Selecione una enfermedad</option>
                    <option *ngFor="let enfermedad of enfermedades" [ngValue]="enfermedad">{{ enfermedad.nombre }}</option>
                </select>
                <label for="floatingSelect">Enfermedad</label>
            </div>
        </div>

    </div>

    <div class="mn-center-row">
        <button (click)="pageBack()" class="btn btn-danger">Volver</button>

        <button type="submit" id="btnSumitCliente" [disabled]="!petForm.form.valid" class="btn btn-primary">{{
            operation | titlecase}}</button>
    </div>

</form>
